services:
  postgres:
    image: postgres:17-alpine
    container_name: stockflow-postgres
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: stockflow
    ports:
      - "5432:5432"
    volumes:
      - stockflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 10

# Kafka ditambahkan pada Phase 4 (Kafka Integration) bersamaan dengan
# transactional outbox publisher dan consumer idempotent.
# Apache Kafka KRaft single-node (tanpa ZooKeeper) — cukup untuk pengembangan lokal.
  kafka:
    image: apache/kafka:3.9.0
    container_name: stockflow-kafka
    hostname: stockflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: stockflow-kafka-cluster-0
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Opsional: UI Kafka untuk inspeksi topic/event selama pengembangan.
  # kafka-ui:
  #   image: provectuslabs/kafka-ui:latest
  #   container_name: stockflow-kafka-ui
  #   environment:
  #     KAFKA_CLUSTERS_0_NAME: local
  #     KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: stockflow-kafka:9092
  #   ports:
  #     - "8081:8081"
  #   depends_on:
  #     - kafka

volumes:
  stockflow-pgdata:
