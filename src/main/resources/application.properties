quarkus.application.name=stockflow-service
quarkus.http.root-path=/

# ---------------------------------------------------------------------------
# Database
# Profil dev  : PostgreSQL dari compose.yaml (localhost:5432)
# Profil prod : nilai dari environment (DB_JDBC_URL, DB_USERNAME, DB_PASSWORD)
# Profil test : URL sengaja tidak diisi agar Dev Services (Testcontainers)
#               menyediakan PostgreSQL sekali pakai.
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:stockflow}
quarkus.datasource.password=${DB_PASSWORD:stockflow}
%dev.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/stockflow}
%prod.quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/stockflow}

# Skema dikelola Flyway; Hibernate hanya memvalidasi.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true

# ---------------------------------------------------------------------------
# Health & observability
# ---------------------------------------------------------------------------
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.enabled=true

# ---------------------------------------------------------------------------
# Transactional outbox publisher (FSD §10.3)
# ---------------------------------------------------------------------------
outbox.publisher.enabled=true
outbox.publisher.poll-interval=1m
outbox.publisher.page-size=50
outbox.publisher.max-attempts=10
outbox.publisher.lock-lease=30s

# Scheduler outbox tidak dijalankan selama test (test memanggil publisher langsung).
%test.outbox.publisher.poll-interval=24h

# ---------------------------------------------------------------------------
# Kafka (FSD §10.2)
# ---------------------------------------------------------------------------
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
mp.messaging.outgoing.stock-events.connector=smallrye-kafka
mp.messaging.outgoing.stock-events.topic=stockflow.inventory.events.v1
mp.messaging.outgoing.stock-events.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.stock-events.value.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
quarkus.log.category."com.stockflow".level=INFO
