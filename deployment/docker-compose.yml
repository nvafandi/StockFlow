# Stack deployment StockFlow ke server dev (172.24.97.230)
# Terdiri dari: PostgreSQL + Kafka (KRaft single-node) + aplikasi StockFlow.
# Dipakai oleh CI/CD (.github/workflows/deploy-dev.yml) melalui `docker compose up -d`.
#
# Struktur direktori di server:
#   /opt/stockflow/
#   ├── app.jar                      <- artifact hasil build CI
#   └── deployment/
#       ├── docker-compose.yml       <- file ini
#       └── config/
#           └── application-dev-properties

name: stockflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: stockflow-postgres
    environment:
      POSTGRES_DB: stockflow
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow}
    volumes:
      - stockflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    container_name: stockflow-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: StockFlowKRaftCluster0000000000000000000
    volumes:
      - stockflow-kraft:/var/lib/kafka/data
    restart: unless-stopped

  app:
    image: eclipse-temurin:25-jre-jammy
    container_name: stockflow-service
    command: ["sh", "-c", "exec java $JAVA_OPTS -jar /app/app.jar"]
    volumes:
      - ../app.jar:/app/app.jar:ro
      - ./config/application-dev-properties:/application.properties:ro
    environment:
      QUARKUS_CONFIG_LOCATIONS: /application.properties
      QUARKUS_PROFILE: dev
      JAVA_OPTS: -Xmx512m
      DB_JDBC_URL: jdbc:postgresql://postgres:5432/stockflow
      DB_USERNAME: stockflow
      DB_PASSWORD: ${POSTGRES_PASSWORD:-stockflow}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

volumes:
  stockflow-pgdata:
  stockflow-kraft:
