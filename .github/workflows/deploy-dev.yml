name: "StockFlow CI/CD - Deploy ke Server Dev (172.24.97.230)"

on:
  pull_request:
    branches: [dev]
    types: [closed, synchronize, reopened]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Build di GitHub-hosted runner (cepat, ada cache Maven).
  # ---------------------------------------------------------------------------
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Quarkus application
        run: ./mvnw -B package -DskipTests

      - name: Upload artifact deployment
        uses: actions/upload-artifact@v4
        with:
          name: stockflow-deploy
          path: |
            target/*runner.jar
            deployment/docker-compose.yml
            deployment/config/application-dev-properties
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Deploy di self-hosted runner (di server dev sendiri, akses Docker lokal).
  # Server dev hanya bisa dijangkau via ZeroTier, sehingga job ini tidak
  # memakai SSH — semua operasi berjalan langsung di server.
  # ---------------------------------------------------------------------------
  deploy:
    needs: build
    runs-on: [self-hosted, stockflow]
    timeout-minutes: 30

    steps:
      - name: Download artifact deployment
        uses: actions/download-artifact@v4
        with:
          name: stockflow-deploy
          path: deploy-dist

      - name: Susun berkas di /opt/stockflow
        run: |
          SRC="$GITHUB_WORKSPACE/deploy-dist"
          mkdir -p /opt/stockflow/deployment/config
          cp "$SRC"/*runner.jar /opt/stockflow/app.jar
          cp "$SRC"/docker-compose.yml /opt/stockflow/deployment/docker-compose.yml
          cp "$SRC"/application-dev-properties /opt/stockflow/deployment/config/application-dev-properties
          ls -lh /opt/stockflow/app.jar /opt/stockflow/deployment/

      - name: Deploy stack via Docker Compose
        run: |
          cd /opt/stockflow/deployment
          docker compose up -d --remove-orphans
          docker compose restart app

      - name: Verifikasi health endpoint
        run: |
          echo "Cek health endpoint..."
          for i in $(seq 1 15); do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/q/health || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check LULUS (HTTP 200)"
              exit 0
            fi
            echo "Menunggu server start (percobaan $i/15, status: $RESPONSE)..."
            sleep 10
          done
          echo "Health check gagal — log container:"
          docker logs stockflow-service --tail 50 || true
          exit 1
