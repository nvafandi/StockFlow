name: "StockFlow CI/CD - Deploy ke Server Dev (172.24.97.230)"

on:
  pull_request:
    branches: [dev]
    types: [closed, synchronize, reopened]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 30

    env:
      SERVER_IP: 172.24.97.230
      SSH_USER: nurvan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Quarkus application
        run: ./mvnw -B package -DskipTests

      - name: Install sshpass
        run: |
          if ! command -v sshpass &>/dev/null; then
            sudo apt-get update && sudo apt-get install -y sshpass
          fi

      - name: Siapkan direktori deployment di server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SERVER_IP" \
            "mkdir -p /opt/stockflow/deployment/config"

      - name: SCP artifact & deployment ke server
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          LOCAL_JAR=$(ls -t target/*runner.jar 2>/dev/null | head -1)
          if [ -z "$LOCAL_JAR" ]; then
            LOCAL_JAR=$(ls -t target/*.jar | head -1)
          fi
          echo "Upload artifact: $LOCAL_JAR"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no "$LOCAL_JAR" "$SSH_USER@$SERVER_IP:/opt/stockflow/app.jar"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no deployment/docker-compose.yml "$SSH_USER@$SERVER_IP:/opt/stockflow/deployment/docker-compose.yml"
          sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no deployment/config/application-dev-properties "$SSH_USER@$SERVER_IP:/opt/stockflow/deployment/config/application-dev-properties"

      - name: Deploy stack via Docker Compose
        env:
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SERVER_IP" \
            "cd /opt/stockflow/deployment && docker compose up -d --remove-orphans && docker compose restart app"

      - name: Verifikasi health endpoint
        if: always()
        run: |
          echo "Cek health endpoint di server..."
          for i in {1..10}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://172.24.97.230:8080/q/health || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check LULUS (HTTP 200)"
              exit 0
            fi
            echo "Menunggu server start (percobaan $i/10, status: $RESPONSE)..."
            sleep 10
          done
          echo "Health check gagal setelah 10 percobaan"
          exit 1
