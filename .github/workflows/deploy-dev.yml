name: "StockFlow CI/CD - Deploy ke Server Dev (172.24.97.230)"

on:
  pull_request:
    branches: [dev]
    types: [closed, synchronize, reopened]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    timeout-minutes: 30

    env:
      SERVER_IP: 172.24.97.230
      SSH_USER: nurvan
      SSH_KEY_PATH: ${{ runner.temp }}/stockflow_deploy_key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build Quarkus application
        run: ./mvnw -B package -DskipTests

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          umask 077
          echo "$SSH_PRIVATE_KEY" > "$SSH_KEY_PATH"
          chmod 600 "$SSH_KEY_PATH"
          echo "SSH_OPTIONS=-i $SSH_KEY_PATH -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o ConnectTimeout=15" >> "$GITHUB_ENV"

      - name: Siapkan direktori deployment di server
        run: |
          ssh $SSH_OPTIONS "$SSH_USER@$SERVER_IP" \
            "mkdir -p /opt/stockflow/deployment/config"

      - name: SCP artifact & deployment ke server
        run: |
          LOCAL_JAR=$(ls -t target/*runner.jar 2>/dev/null | head -1)
          if [ -z "$LOCAL_JAR" ]; then
            LOCAL_JAR=$(ls -t target/*.jar | head -1)
          fi
          echo "Upload artifact: $LOCAL_JAR"
          scp $SSH_OPTIONS "$LOCAL_JAR" "$SSH_USER@$SERVER_IP:/opt/stockflow/app.jar"
          scp $SSH_OPTIONS deployment/docker-compose.yml "$SSH_USER@$SERVER_IP:/opt/stockflow/deployment/docker-compose.yml"
          scp $SSH_OPTIONS deployment/config/application-dev-properties "$SSH_USER@$SERVER_IP:/opt/stockflow/deployment/config/application-dev-properties"

      - name: Deploy stack via Docker Compose
        run: |
          ssh $SSH_OPTIONS "$SSH_USER@$SERVER_IP" \
            "cd /opt/stockflow/deployment && docker compose up -d --remove-orphans && docker compose restart app"

      - name: Verifikasi health endpoint
        if: always()
        run: |
          echo "Cek health endpoint di server..."
          for i in {1..10}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" http://172.24.97.230:8080/q/health || echo "000")
            if [ "$RESPONSE" = "200" ]; then
              echo "Health check LULUS (HTTP 200)"
              exit 0
            fi
            echo "Menunggu server start (percobaan $i/10, status: $RESPONSE)..."
            sleep 10
          done
          echo "Health check gagal setelah 10 percobaan"
          exit 1
